name: Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify release commit is on the default branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status="$(gh api "repos/$REPOSITORY/compare/$DEFAULT_BRANCH...$RELEASE_SHA" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "发布提交不在默认分支历史中：status=$status" >&2
              exit 1
              ;;
          esac

      - name: Enforce release ref policy
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $expected = "refs/heads/$($env:DEFAULT_BRANCH)"
            if ($env:RELEASE_REF -ne $expected) {
              throw "手动发布仅允许从默认分支运行：期望 $expected，实际 $env:RELEASE_REF"
            }
          }

      - name: Validate app version and tag
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$') {
            throw "tauri.conf.json 版本不是有效 SemVer: $version"
          }
          if ($env:RELEASE_REF.StartsWith("refs/tags/") -and "desktop-v$version" -ne $env:RELEASE_REF_NAME) {
            throw "标签 $env:RELEASE_REF_NAME 与 tauri.conf.json 版本 v$version 不一致"
          }
          $isBeta = $version.Contains("-")
          if ($isBeta -and $version -notmatch '-beta\.[1-9][0-9]*$') {
            throw "测试版版本号必须使用 X.Y.Z-beta.N，实际为 $version"
          }
          $channel = if ($isBeta) { "beta" } else { "stable" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT
          "prerelease=$($isBeta.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Reject an existing release tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          gh release view $tag --repo $env:REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "发布 $tag 已存在；拒绝覆盖已发布资产"
          }
          $tagCommit = gh api "repos/$($env:REPOSITORY)/commits/$tag" --jq .sha 2> $null
          if ($LASTEXITCODE -eq 0 -and $tagCommit -ne $env:RELEASE_SHA) {
            throw "标签 $tag 已指向其它提交，拒绝发布"
          }

      - name: Reject non-increasing app version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $repo = $env:REPOSITORY
          $dir = Join-Path $env:RUNNER_TEMP "oshical-app-version-check"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $manifests = @()

          $releaseJson = gh release list --repo $repo --limit 100 --json tagName,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw "无法读取 Release 列表" }
          $releases = @($releaseJson | ConvertFrom-Json)
          $stableReleases = @(
            $releases | Where-Object {
              $_.tagName -like "desktop-v*" -and -not $_.isPrerelease
            }
          )
          if ($stableReleases.Count -gt 0) {
            $stableTag = $stableReleases[0].tagName
            $stableDir = Join-Path $dir "stable"
            New-Item -ItemType Directory -Force -Path $stableDir | Out-Null
            gh release download $stableTag --repo $repo --pattern latest.json --dir $stableDir --clobber
            if ($LASTEXITCODE -ne 0) { throw "无法读取正式版 latest.json：$stableTag" }
            $manifests += Join-Path $stableDir "latest.json"
          }

          $betaRelease = @($releases | Where-Object { $_.tagName -eq "desktop-beta" }) | Select-Object -First 1
          if ($betaRelease) {
            $betaDir = Join-Path $dir "beta"
            New-Item -ItemType Directory -Force -Path $betaDir | Out-Null
            gh release download desktop-beta --repo $repo --pattern latest-beta.json --dir $betaDir --clobber
            if ($LASTEXITCODE -ne 0) { throw "无法读取测试版 latest-beta.json" }
            $manifests += Join-Path $betaDir "latest-beta.json"
          }

          if ($manifests.Count -gt 0) {
            python scripts/check-release-version.py $version @manifests
            if ($LASTEXITCODE -ne 0) {
              throw "桌面端版本 $version 未严格高于已发布正式版/测试版清单"
            }
          }

      - name: Load desktop release notes
        id: release_notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          try {
            $notes = @(Get-ChildItem -Path 'docs' -File -Filter "*-release-desktop-$env:VERSION.md")
            if ($notes.Count -ne 1) {
              throw "版本 $env:VERSION 必须恰好有一份 docs/*-release-desktop-$env:VERSION.md，实际 $($notes.Count) 份"
            }
            $body = Get-Content -Raw -LiteralPath $notes[0].FullName
            if ([string]::IsNullOrWhiteSpace($body)) {
              throw "发布说明为空：$($notes[0].FullName)"
            }
            $delimiter = "OSHICAL_RELEASE_NOTES_$([guid]::NewGuid().ToString('N'))"
            "body<<$delimiter" >> $env:GITHUB_OUTPUT
            $body >> $env:GITHUB_OUTPUT
            $delimiter >> $env:GITHUB_OUTPUT
          } catch {
            Write-Host "::error title=Desktop release notes::$($_.Exception.Message)"
            throw
          }

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Format, lint and typecheck
        run: npm run check

      - name: Frontend tests
        run: npm run test:web

      - name: Rust tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: "OshiCal Desktop v__VERSION__"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          args: --target x86_64-pc-windows-msvc

      - name: Finalize updater manifest URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $repo = $env:REPOSITORY
          $dir = Join-Path $env:RUNNER_TEMP "oshical-updater"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $tag --repo $repo --pattern latest.json --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw "无法下载 latest.json" }
          $release = gh release view $tag --repo $repo --json assets | ConvertFrom-Json
          $installer = $release.assets | Where-Object { $_.name -eq "OshiCal_${version}_x64-setup.exe" } | Select-Object -First 1
          if (-not $installer) { throw "未找到 Windows 安装包资产" }
          $manifestPath = Join-Path $dir "latest.json"
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "latest.json 版本 $($manifest.version) 与 tauri.conf.json 版本 $version 不一致"
          }
          if (-not $manifest.platforms -or $manifest.platforms.PSObject.Properties.Count -eq 0) {
            throw "latest.json 缺少平台更新条目"
          }
          $platformNames = @($manifest.platforms.PSObject.Properties.Name)
          if (-not ($platformNames -contains "windows-x86_64-nsis") -and -not ($platformNames -contains "windows-x86_64")) {
            throw "latest.json 缺少 Windows 更新平台"
          }
          foreach ($key in @("windows-x86_64", "windows-x86_64-nsis")) {
            if ($manifest.platforms.PSObject.Properties.Name -contains $key) {
              $manifest.platforms.$key.url = $installer.url
            }
          }
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            if ([string]::IsNullOrWhiteSpace($platform.Value.url)) {
              throw "更新清单平台 $($platform.Name) 缺少下载 URL"
            }
            if ([string]::IsNullOrWhiteSpace($platform.Value.signature)) {
              throw "更新清单平台 $($platform.Name) 缺少 Tauri 签名"
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          gh release upload $tag $manifestPath --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "无法更新 latest.json" }

      - name: Publish fixed beta updater manifest
        if: steps.version.outputs.channel == 'beta'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          $betaTag = "desktop-beta"
          $repo = $env:REPOSITORY
          $dir = Join-Path $env:RUNNER_TEMP "oshical-beta-updater"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $source = Join-Path $dir "latest.json"
          $betaManifest = Join-Path $dir "latest-beta.json"
          gh release download $tag --repo $repo --pattern latest.json --dir $dir --clobber
          if ($LASTEXITCODE -ne 0) { throw "无法下载测试版 latest.json" }
          Copy-Item -LiteralPath $source -Destination $betaManifest -Force
          gh release view $betaTag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $betaTag --repo $repo --latest=false --target $env:RELEASE_SHA `
              --title "OshiCal Desktop Beta" `
              --notes "桌面端测试版自动更新清单。仅由 Release 工作流维护，不占用 latest。"
            if ($LASTEXITCODE -ne 0) { throw "无法创建 $betaTag 更新清单 Release" }
          }
          gh release upload $betaTag $betaManifest --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "无法更新测试版 latest-beta.json" }
