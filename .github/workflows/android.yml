name: Android

# Android APK 构建：只产出“服务器模式”客户端。
#
# 触发：
#   - workflow_dispatch：手动构建（任意分支，用于验证 gen/android 工程壳能否生成）
#   - push tag android-v*：与 desktop-v* / server-v* 标签互不影响
#
# 与 ci.yml / release.yml 的约定保持一致：
#   - actions 尽量 pin 到 commit SHA；没有可核对 SHA 的第三方 action 先用主版本号，
#     并在行尾注释里标明待补 SHA（见 setup-java、setup-android、upload-artifact）。
#   - Node 24、npm ci、dtolnay/rust-toolchain、Swatinem/rust-cache、中文 step 名称。
#
# 两个必须知道的运维事实：
#   1) 首次运行会在 CI 里执行 `npx tauri android init --ci` 生成 src-tauri/gen/android
#      （Tauri 的 Android Gradle 工程壳）。`.gitignore` 现在只忽略 `src-tauri/gen/schemas/`，
#      所以首次生成的工程壳应当提交回仓库：这样构建可复现，签名配置和
#      network_security_config 也有地方维护。提交之前，每次 CI 都会重新生成工程壳。
#   2) 签名材料全部来自仓库 Secrets（见 docs/22-android-client.md 第 4 节）。缺失时
#      流水线不失败，只产出未签名/调试签名的 APK，并在日志里给出 notice 提示。
#
# 本工作流不在任何开发机上执行；AGENTS.md 禁止在本工作区做构建（含 cargo/npm/tauri/docker）。

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # 与 docs/22-android-client.md 记录的 NDK 版本保持一致；改这里要同步改文档。
  NDK_VERSION: "27.0.12077973"

jobs:
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: 安装 Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      # JDK 17 是当前 Tauri 2 Android 模板（AGP 8.x）要求的版本。
      # 仓库里没有其它工作流 pin 过 setup-java，暂用 @v4；补到 SHA 后替换本行。
      - name: 安装 JDK 17
        uses: actions/setup-java@v4 # TODO: 无已核对 SHA，暂用主版本号
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 运行器自带 Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk）。
      # 不再使用 android-actions/setup-android：v3 会执行 `sdkmanager tools`，新版 SDK 仓库里
      # 已没有 `tools` 包，该步骤必然失败（run 42387880140 的实测结果）。
      - name: 准备 Android SDK 与 NDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -n1 || true)"
          fi
          if [ -z "$sdkmanager_bin" ]; then
            echo "找不到 sdkmanager，运行器镜像可能没有预装 Android SDK" >&2
            exit 1
          fi
          echo "使用 sdkmanager: $sdkmanager_bin"
          # 先统一接受许可，避免 sdkmanager 卡在交互提示，也让 Gradle 能自动补齐缺失组件。
          yes | "$sdkmanager_bin" --licenses > /dev/null 2>&1 || true
          "$sdkmanager_bin" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          ndk_dir="$ANDROID_HOME/ndk/${NDK_VERSION}"
          if [ ! -d "$ndk_dir" ]; then
            echo "NDK 安装失败，未找到 $ndk_dir" >&2
            exit 1
          fi
          {
            printf 'ANDROID_HOME=%s\n' "$ANDROID_HOME"
            printf 'ANDROID_SDK_ROOT=%s\n' "$ANDROID_SDK_ROOT"
            printf 'NDK_HOME=%s\n' "$ndk_dir"
            printf 'ANDROID_NDK_HOME=%s\n' "$ndk_dir"
          } >> "$GITHUB_ENV"
          printf 'SDK/NDK 已就绪：%s\n' "$ndk_dir"

      # 三个目标对应 Android ABI：aarch64 → arm64-v8a，armv7 → armeabi-v7a，
      # x86_64 → x86_64（模拟器）。与 docs/22-android-client.md 第 4 节的 ABI 表一致。
      - name: 安装 Rust 工具链与 Android 目标
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust 缓存
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: android
          cache-on-failure: true

      - name: 安装前端依赖
        run: npm ci

      # 工程壳已入库（src-tauri/gen/android）。这一步只做兜底：目录被清空时重新生成。
      - name: 检查 Android 工程壳
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src-tauri/gen/android/app ]; then
            echo "src-tauri/gen/android 已入库，跳过 npx tauri android init"
          else
            echo "src-tauri/gen/android 缺失：重新生成 Tauri Android 工程壳"
            # `--ci` 在部分 CLI 版本上是全局参数、部分版本只给 init；参数不被接受时退回不带该参数。
            npx tauri android init --ci || npx tauri android init
            echo "::notice title=Android 工程壳被重新生成::请把 src-tauri/gen/android 的改动提交回仓库"
          fi

      # 签名材料只在这里展开成文件，不打印任何密钥内容。
      # 工程壳（src-tauri/gen/android/app/build.gradle.kts）会读取 rootProject 下的 key.properties：
      #   - 仓库配置了 ANDROID_KEY_BASE64：用正式发布密钥签名；
      #   - 没配置：用本次流水线临时生成的密钥签名，APK 能直接安装，但换一次运行签名就变。
      - name: 准备签名材料
        shell: bash
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p src-tauri/gen/android
          if [ -n "${ANDROID_KEY_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEY_BASE64" | base64 -d > src-tauri/gen/android/oshical-release.keystore
            {
              printf 'storeFile=oshical-release.keystore\n'
              printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD:-}"
              printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS:-}"
              printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD:-}"
            } > src-tauri/gen/android/key.properties
            echo "使用仓库 Secrets 中的发布签名密钥（内容不打印）"
          else
            echo "::notice title=临时签名::仓库未配置 ANDROID_KEY_BASE64，使用本次运行生成的临时密钥签名"
            keytool -genkeypair \
              -keystore src-tauri/gen/android/ci-signing.keystore \
              -storetype JKS -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-signing -keypass ci-signing \
              -dname "CN=OshiCal CI, OU=CI, O=OshiCal, C=CN" > /dev/null 2>&1
            {
              printf 'storeFile=ci-signing.keystore\n'
              printf 'storePassword=ci-signing\n'
              printf 'keyAlias=ci\n'
              printf 'keyPassword=ci-signing\n'
            } > src-tauri/gen/android/key.properties
          fi
          echo "key.properties 已就绪（内容不打印），签名由 app/build.gradle.kts 的 signingConfigs 应用。"

      - name: 构建 APK
        shell: bash
        run: |
          set -euo pipefail
          npx tauri android build --apk

      # 仓库现有 server-binary.yml 也用 @v4；补到 SHA 后替换本行。
      - name: 上传 APK
        uses: actions/upload-artifact@v4 # TODO: 无已核对 SHA，暂用主版本号
        with:
          name: oshical-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14

# 后续若要像 release.yml 那样把 APK 挂到 Release，再加一个 publish job，
# 复用 "release" 环境需要的 contents: write，并把上面 job 的 artifact 下载后
# 用 gh release upload 上传；本次只保证 APK 能被下载。
