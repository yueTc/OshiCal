name: CI

on:
  push:
    branches:
      - main
      - master
      - codex/sync-prune-history
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npx tsc -b --pretty false

      - name: Rust format and lint
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:CARGO_TERM_COLOR = 'never'
          $clippyOutput = @(cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1)
          $clippyExit = $LASTEXITCODE
          $clippyOutput | ForEach-Object { Write-Host $_ }
          if ($clippyExit -ne 0) {
            $diagnostics = @(
              $clippyOutput |
                Where-Object { $_ -match '(?i)error:|warning:' } |
                Select-Object -First 25
            )
            if ($diagnostics.Count -eq 0) {
              $diagnostics = @($clippyOutput | Select-Object -Last 20)
            }
            foreach ($line in $diagnostics) {
              $message = $line.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Rust clippy::$message"
            }
          }
          exit $clippyExit

      - name: Frontend tests
        if: ${{ !cancelled() }}
        run: npm run test:web

      - name: Rust tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | Tee-Object -Variable testOutput
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $failures = $testOutput | Select-String -Pattern 'FAILED|panicked at|assertion' -Context 0,4
            foreach ($failure in $failures) {
              $message = $failure.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Rust test failure::$message"
            }
          }
          exit $testExit

      - name: Frontend production build
        if: ${{ !cancelled() }}
        run: npm run build:web
