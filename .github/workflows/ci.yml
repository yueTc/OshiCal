name: CI

on:
  push:
    branches:
      - main
      - master
      - codex/live-broadcast-card
      - youtube
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend typecheck
        run: npx tsc -b --pretty false

      - name: Rust format and lint
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $env:CARGO_TERM_COLOR = 'never'
          $clippyOutput = @(cargo clippy --workspace --all-targets --message-format=short -- -D warnings 2>&1)
          $clippyExit = $LASTEXITCODE
          $clippyOutput | ForEach-Object { Write-Host $_ }
          if ($clippyExit -ne 0) {
            $diagnostics = @(
              $clippyOutput |
                Where-Object { $_ -match '(?i)error(?:\[[^\]]+\])?:|warning:' } |
                Select-Object -First 25
            )
            if ($diagnostics.Count -eq 0) {
              $diagnostics = @($clippyOutput | Select-Object -Last 20)
            }
            foreach ($line in $diagnostics) {
              $message = $line.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Rust clippy::$message"
            }
          }
          exit $clippyExit

      - name: Refresh timing summary tests
        if: ${{ !cancelled() }}
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s scripts -p test_refresh_timing.py -v

      - name: Live schedule pre-fix regression evidence
        if: ${{ !cancelled() }}
        run: |
          git fetch --no-tags origin fa78d8c44cdca5dfbb81bdc70fc96689a4c35312
          node scripts/live-schedule-baseline.mjs

      - name: Frontend tests
        if: ${{ !cancelled() }}
        run: npm run test:web

      - name: YouTube fixture contracts
        if: ${{ !cancelled() }}
        run: node scripts/youtube-fixtures/validate-fixtures.mjs

      - name: Rust tests
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          cargo test --workspace --locked --no-fail-fast 2>&1 | Tee-Object -Variable testOutput
          $testExit = $LASTEXITCODE
          $summaries = @($testOutput | Where-Object { $_ -match '^test result:' }) -join '; '
          if ($summaries) { Write-Host "::notice title=Rust test totals::$summaries" }
          if ($testExit -ne 0) {
            $failures = $testOutput | Select-String -Pattern 'FAILED|panicked at|assertion|error\[E[0-9]+\]' -Context 0,6
            foreach ($failure in $failures) {
              $message = $failure.ToString().Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Rust test failure::$message"
            }
          }
          exit $testExit

      - name: Frontend production build
        if: ${{ !cancelled() }}
        run: npm run build:web

      - name: Install isolated UI test runtime
        if: success()
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'oshical-ui-runtime'
          npm install --prefix $runtime --no-package-lock --ignore-scripts playwright@1.56.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $runtime 'node_modules/playwright/cli.js') install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OSHICAL_UI_RUNTIME=$runtime" >> $env:GITHUB_ENV

      - name: Live online chart browser interactions
        if: success()
        run: node scripts/live-online-ui.mjs

      - name: Live broadcast card browser interactions
        if: success()
        run: node scripts/live-broadcast-ui.mjs

      - name: Upload UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-online-ui
          path: ui-artifacts/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload web preview for UI verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: dist/
          retention-days: 3
          if-no-files-found: error
