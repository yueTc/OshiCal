name: Server Image

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read server version
        id: version
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('server/Cargo.toml', 'rb'))['package']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify server tag matches version
        if: startsWith(github.ref, 'refs/tags/server-v')
        shell: bash
        run: |
          expected="server-v${{ steps.version.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与服务端版本 $expected 不一致" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oshical-server
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish server update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          repo="${{ github.repository }}"
          manifest="server-latest.json"
          jq -n \
            --arg version "$version" \
            --arg tag "server-v$version" \
            --arg image "ghcr.io/${{ github.repository_owner }}/oshical-server:$version" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, tag: $tag, image: $image, publishedAt: $publishedAt}' > "$manifest"
          if gh release view server-latest --repo "$repo" >/dev/null 2>&1; then
            gh release upload server-latest "$manifest" --repo "$repo" --clobber
            gh release edit server-latest --repo "$repo" --prerelease --latest=false
          else
            gh release create server-latest "$manifest" \
              --repo "$repo" \
              --target "$GITHUB_SHA" \
              --title "OshiCal Server Latest" \
              --notes "服务端更新代理使用的机器可读清单。请勿手动修改。" \
              --prerelease \
              --latest=false
          fi
