name: Server Image

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/yuetc/oshical-server
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify release commit is on the default branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status="$(gh api "repos/$REPOSITORY/compare/$DEFAULT_BRANCH...$RELEASE_SHA" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *)
              echo "发布提交不在默认分支历史中：status=$status" >&2
              exit 1
              ;;
          esac

      - name: Read and validate application version
        id: version
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('server/Cargo.toml','rb'))['package']['version'])")"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "server/Cargo.toml 中的版本不是有效 SemVer: $version" >&2
            exit 1
          fi
          channel=stable
          if [[ "$version" == *-beta.* ]]; then
            if [[ ! "$version" =~ -beta\.[1-9][0-9]*$ ]]; then
              echo "测试版版本号必须使用 X.Y.Z-beta.N: $version" >&2
              exit 1
            fi
            channel=beta
          elif [[ "$version" == *-* ]]; then
            echo "仅支持正式版或 -beta.N 测试版: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'channel=%s\n' "$channel" >> "$GITHUB_OUTPUT"

      - name: Enforce default branch for manual publish
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "手动发布仅允许从默认分支 $DEFAULT_BRANCH 运行，当前为 $RELEASE_REF" >&2
            exit 1
          fi

      - name: Reject non-increasing server version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          manifest_root="$RUNNER_TEMP/server-version-check"
          mkdir -p "$manifest_root"

          check_manifest() {
            local release_tag="$1"
            local manifest_dir="$manifest_root/$release_tag"
            local assets manifest_name
            mkdir -p "$manifest_dir"
            if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              return 0
            fi
            assets="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if printf '%s\n' "$assets" | grep -Fxq latest-server.json; then
              manifest_name=latest-server.json
            elif printf '%s\n' "$assets" | grep -Fxq server-latest.json; then
              manifest_name=server-latest.json
            else
              echo "已发布服务器清单 $release_tag 缺失，拒绝继续发布" >&2
              exit 1
            fi
            if ! gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern "$manifest_name" --dir "$manifest_dir"; then
              echo "无法读取已发布的服务器更新清单 $release_tag，拒绝继续发布" >&2
              exit 1
            fi
            python scripts/check-release-version.py "$VERSION" "$manifest_dir/$manifest_name"
          }

          check_manifest server-latest
          check_manifest server-beta

      - name: Verify tag matches server version
        if: startsWith(github.ref, 'refs/tags/server-v')
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF_NAME" != "server-v$VERSION" ]]; then
            echo "标签 $RELEASE_REF_NAME 与 server/Cargo.toml 版本 server-v$VERSION 不一致" >&2
            exit 1
          fi

      - name: Verify server tag matches version
        if: startsWith(github.ref, 'refs/tags/server-v')
        shell: bash
        run: |
          expected="server-v${{ steps.version.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "标签 ${GITHUB_REF_NAME} 与服务端版本 $expected 不一致" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ steps.version.outputs.channel == 'stable' }}
            type=raw,value=beta,enable=${{ steps.version.outputs.channel == 'beta' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish signed updater manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      IMAGE_REPOSITORY: ghcr.io/yuetc/oshical-server
      VERSION: ${{ needs.build.outputs.version }}
      CHANNEL: ${{ needs.build.outputs.channel }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Publish fixed and signed server updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_SIGNING_KEY: ${{ secrets.OSHICAL_SERVER_UPDATE_HMAC_KEY }}
        run: |
          manifest_dir="$RUNNER_TEMP/server-updater"
          manifest="$manifest_dir/latest-server.json"
          if [[ "$CHANNEL" == "beta" ]]; then
            release_tag="server-beta"
            release_title="OshiCal Server Beta"
            release_note="服务器测试版自动更新清单。仅由 Server Image 工作流维护。"
          else
            release_tag="server-latest"
            release_title="OshiCal Server latest"
            release_note="服务器正式版自动更新清单。仅由 Server Image 工作流维护。"
          fi
          mkdir -p "$manifest_dir"
          # The manifest is the publication boundary. The HMAC binds the
          # channel, repository, version, and immutable image digest together.
          python - "$VERSION" "$DIGEST" "$IMAGE_REPOSITORY" "$manifest" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import re
          import sys

          version, digest, repository, output = sys.argv[1:5]
          key_text = os.environ.get("UPDATE_SIGNING_KEY", "").strip()
          if not re.fullmatch(r"[0-9a-f]{64}", key_text):
              raise SystemExit("OSHICAL_SERVER_UPDATE_HMAC_KEY must be 64 lowercase hex characters")
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"invalid server version: {version!r}")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"invalid image digest: {digest!r}")
          if not re.fullmatch(r"ghcr\.io/yuetc/oshical-server", repository):
              raise SystemExit(f"invalid image repository: {repository!r}")
          payload = f"server\n{repository}\n{version}\n{digest}".encode("ascii")
          signature = hmac.new(bytes.fromhex(key_text), payload, hashlib.sha256).hexdigest()
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(
                  {
                      "channel": "server",
                      "version": version,
                      "imageDigest": digest,
                      "signature": signature,
                  },
                  handle,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )
              handle.write("\n")
          PY
          python - "$manifest" "$IMAGE_REPOSITORY" <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          expected_fields = {"channel", "version", "imageDigest", "signature"}
          if set(manifest) != expected_fields:
              raise SystemExit(f"invalid manifest fields: {sorted(manifest)}")
          if manifest["channel"] != "server":
              raise SystemExit("invalid manifest channel")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", manifest["imageDigest"]):
              raise SystemExit("manifest imageDigest is invalid")
          if not re.fullmatch(r"[0-9a-f]{64}", manifest["signature"]):
              raise SystemExit("manifest signature is invalid")
          key_text = os.environ.get("UPDATE_SIGNING_KEY", "").strip()
          payload = f"server\n{sys.argv[2]}\n{manifest['version']}\n{manifest['imageDigest']}".encode("ascii")
          expected = hmac.new(bytes.fromhex(key_text), payload, hashlib.sha256).hexdigest()
          if not hmac.compare_digest(expected, manifest["signature"]):
              raise SystemExit("manifest signature self-check failed")
          PY

          # Keep the existing server client channel working while 0.3.0 migrates
          # to the signed manifest filename and immutable image references.
          legacy_manifest="$manifest_dir/server-latest.json"
          python - "$manifest" "$legacy_manifest" "$IMAGE_REPOSITORY" <<'PY'
          import datetime
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          manifest.update({
              "tag": "server-v" + manifest["version"],
              "image": sys.argv[3] + "@" + manifest["imageDigest"],
              "publishedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          })
          with open(sys.argv[2], "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, separators=(",", ":"))
              handle.write("\n")
          PY
          version_tag="server-v$VERSION"
          if gh release view "$version_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "发布 $version_tag 已存在，拒绝覆盖" >&2
            exit 1
          fi
          release_flags=(--latest=false)
          if [[ "$CHANNEL" == "beta" ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$version_tag" "$manifest" "$legacy_manifest" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" "${release_flags[@]}" \
            --title "OshiCal Server v$VERSION" \
            --notes "服务端 $VERSION（$CHANNEL）。镜像：$IMAGE_REPOSITORY@$DIGEST。宿主更新代理升级前须配置 /etc/oshical/updater-hmac.key。"

          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --target "$GITHUB_SHA" \
              --title "$release_title" \
              --notes "$release_note"
          fi
          # Upload is the publication step. The single signed manifest asset
          # carries version and digest together, so readers never consume half a release.
          gh release upload "$release_tag" "$manifest" "$legacy_manifest" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "$release_title" \
            --notes "$release_note $GITHUB_REF_NAME 发布版本：$VERSION；渠道：$CHANNEL；镜像摘要：$DIGEST。"
          echo "Published signed server manifest version=$VERSION imageDigest=$DIGEST"
