<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>推历 OshiCal · 宣传片</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module" src="./preview.js"></script>
<script type="module">
import { DUR, CUES, SHOTS, b } from './timeline.js';
import { clamp, lerp, seg, ease, snap, glide, spring, springTo, tween, stagger, pulse, shake,
         mix, rgba, stageSize, setupCanvas, loadFonts, loadImage } from './motion.js';

// ─────────────────────────────────────────────────────────────── 舞台
const { W, H } = stageSize();
const canvas = document.getElementById('c');
const ctx = setupCanvas(canvas, W, H);
const U = Math.min(W, H) / 1080;
const cx = W / 2, cy = H / 2;

const FONT_UI = '"Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif';
const FONT_NUM = '"Consolas", "Segoe UI", monospace';

const C = {
  paper: '#FFF8FB', surface: '#FFFFFF', soft: '#FFF2F7', strong: '#FDE9F1',
  pink: '#E94F88', pinkStrong: '#B83246', pinkSoft: '#FFE3EE',
  ink: '#241820', muted: '#75636D', faint: '#A3909A',
  border: '#EEDDE5', live: '#16A46B', liveSoft: '#E4F8EF', warn: '#D88719',
  grey: '#C3B4BB',
};

const shot = id => SHOTS.find(s => s.id === id);
const at = (id, frac) => { const s = shot(id); return s.t0 + (s.t1 - s.t0) * frac; };

// ─────────────────────────────────────────────────────────────── 绘制原语
function setFont(size, weight = 700, family = FONT_UI) {
  ctx.font = `${weight} ${size * U}px ${family}`;
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.roundRect(x, y, Math.max(1, w), Math.max(1, h), Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)));
}
function fillRR(x, y, w, h, r, fill, { shadow = 0, alpha = 1 } = {}) {
  if (w <= 0 || h <= 0 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  rr(x, y, w, h, r);
  if (shadow > 0) {
    ctx.shadowColor = `rgba(87,35,57,${0.30 * shadow})`;
    ctx.shadowBlur = 56 * U * (0.6 + shadow);
    ctx.shadowOffsetY = 18 * U * shadow;
  }
  ctx.fillStyle = fill;
  ctx.fill();
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}
function strokeRR(x, y, w, h, r, color, lw = 1.5, alpha = 1) {
  if (w <= 0 || h <= 0 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  rr(x, y, w, h, r);
  ctx.lineWidth = lw * U;
  ctx.strokeStyle = color;
  ctx.stroke();
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}
function text(s, x, y, { size = 32, weight = 700, color = C.ink, align = 'left', baseline = 'middle',
                         alpha = 1, family = FONT_UI, spacing = 0, maxWidth = null } = {}) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  setFont(size, weight, family);
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  if (spacing) ctx.letterSpacing = `${spacing * U}px`;
  ctx.fillText(s, x, y, maxWidth ?? undefined);
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}
function measure(s, size, weight = 700, family = FONT_UI, spacing = 0) {
  ctx.save(); setFont(size, weight, family); if (spacing) ctx.letterSpacing = `${spacing * U}px`;
  const w = ctx.measureText(s).width; ctx.restore(); return w;
}
/** 遮罩逐字上升：k = 0..1 */
function riseChars(s, x, y, { size = 72, weight = 700, color = C.ink, k = 1, spacing = 2,
                              family = FONT_UI, staggerK = 0.45, alpha = 1 } = {}) {
  const chars = [...s];
  const widths = chars.map(ch => measure(ch, size, weight, family, spacing));
  const total = widths.reduce((a, v) => a + v, 0);
  let px = x;
  ctx.save();
  ctx.beginPath(); ctx.rect(x - size * 0.3 * U, y - size * 1.05 * U, total + size * 0.7 * U, size * 1.68 * U); ctx.clip();
  chars.forEach((ch, i) => {
    const d = clamp((k - stagger(i, chars.length, staggerK, { from: 'start' })) / (1 - staggerK || 1));
    const e = ease.outQuart(d);
    const dy = (1 - e) * size * 1.05 * U;
    text(ch, px, y + dy, { size, weight, color, family, spacing, alpha: alpha * clamp(d * 2.2) });
    px += widths[i];
  });
  ctx.restore();
  return total + spacing * U * (chars.length - 1);
}

/** 真实截图窗口：等比 cover 进圆角矩形，返回 图片坐标 → 屏幕坐标 的映射 */
function shotWindow(img, x, y, w, h, { r = 20, shadow = 0.16, alpha = 1 } = {}) {
  const k = Math.max(w / img.width, h / img.height);
  const dw = img.width * k, dh = img.height * k;
  const ox = x + (w - dw) / 2, oy = y + (h - dh) / 2;
  ctx.save();
  ctx.globalAlpha *= alpha;
  rr(x, y, w, h, r * U);
  if (shadow > 0) {
    ctx.shadowColor = `rgba(87,35,57,${0.32 * shadow})`;
    ctx.shadowBlur = 70 * U * (0.5 + shadow);
    ctx.shadowOffsetY = 24 * U * shadow;
  }
  ctx.fillStyle = C.surface; ctx.fill();
  ctx.restore();

  ctx.save();
  rr(x, y, w, h, r * U);
  ctx.clip();
  ctx.globalAlpha *= alpha;
  ctx.drawImage(img, ox, oy, dw, dh);
  ctx.restore();

  strokeRR(x, y, w, h, r, 'rgba(228,200,213,.95)', 1.5, alpha);
  return (ix, iy) => [ox + ix * k, oy + iy * k, k];
}

/** 同一张图，用左右擦除把下一张"翻"出来 */
function wipeWindows(imgA, imgB, x, y, w, h, p, opts = {}) {
  const kA = shotWindow(imgA, x, y, w, h, { ...opts, shadow: 0.6 });
  if (p <= 0) return kA;
  const wipeX = x + w * ease.inOutCubic(clamp(p));
  ctx.save();
  rr(x, y, w, h, (opts.r ?? 20) * U); ctx.clip();
  ctx.beginPath(); ctx.rect(0, 0, wipeX, H); ctx.clip();
  shotWindow(imgB, x, y, w, h, { ...opts, shadow: 0 });
  ctx.restore();
  // 擦除边缘的一道粉色光
  if (p > 0 && p < 1) {
    ctx.save();
    ctx.globalAlpha = 0.85 * Math.sin(Math.PI * clamp(p));
    const g = ctx.createLinearGradient(wipeX - 40 * U, 0, wipeX + 8 * U, 0);
    g.addColorStop(0, 'rgba(233,79,136,0)'); g.addColorStop(1, C.pink);
    ctx.fillStyle = g; ctx.fillRect(wipeX - 40 * U, y, 44 * U, h);
    ctx.restore();
  }
  return kA;
}

function drawLogo(x, y, size, alpha = 1, rot = 0) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.drawImage(LOGO, -size / 2, -size / 2, size, size);
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}

/** 粉色描边圈出一块真实界面 + 对勾徽标 */
function ringRect(x, y, w, h, p, t0, t, r = 14) {
  const born = clamp(p * 1.8);
  if (p <= 0) return;
  const breathe = 0.55 + 0.45 * Math.abs(Math.cos((t - t0) * 2.2));
  const per = (w + h) * 2;
  ctx.save();
  ctx.globalAlpha = 0.16 * born * breathe;
  rr(x - 4 * U, y - 4 * U, w + 8 * U, h + 8 * U, r * U); ctx.fillStyle = C.pink; ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.95 * born;
  rr(x - 5 * U, y - 5 * U, w + 10 * U, h + 10 * U, (r + 1.5) * U);
  ctx.lineWidth = 3 * U; ctx.strokeStyle = C.pink;
  ctx.setLineDash([per, per * 2]);
  ctx.lineDashOffset = per * 2 * (1 - ease.outCubic(clamp(p)));
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
  const badge = spring(t - (t0 + 0.35), { freq: 3.0, damp: 0.6 });
  if (badge > 0.01) {
    const bxs = x + w - 4 * U, bys = y + 4 * U;
    ctx.save();
    ctx.globalAlpha = clamp(badge);
    ctx.beginPath(); ctx.arc(bxs, bys, 13 * U * clamp(badge), 0, Math.PI * 2);
    ctx.fillStyle = C.pink; ctx.fill();
    ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 3 * U; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(bxs - 6.5 * U, bys + 0.5 * U); ctx.lineTo(bxs - 2 * U, bys + 5.5 * U); ctx.lineTo(bxs + 7.5 * U, bys - 5.5 * U);
    ctx.stroke();
    ctx.restore();
  }
}

/** 光标：矢量箭头，按下时缩小并扩散圆环 */
function cursor(x, y, { press = 0, alpha = 1 } = {}) {
  const s = 34 * U * (1 - 0.12 * press);
  if (press > 0) {
    ctx.save();
    ctx.globalAlpha *= alpha * (1 - press) * 0.5;
    ctx.beginPath(); ctx.arc(x, y, (26 + 34 * press) * U, 0, Math.PI * 2);
    ctx.fillStyle = C.pink; ctx.fill();
    ctx.restore();
  }
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x, y); ctx.scale(s / 34, s / 34);
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(8.6, 26); ctx.lineTo(14, 38);
  ctx.lineTo(19.6, 35.4); ctx.lineTo(14.2, 23.6); ctx.lineTo(25, 22.4); ctx.closePath();
  ctx.fillStyle = '#2A1B22'; ctx.fill();
  ctx.lineWidth = 2.4; ctx.strokeStyle = '#FFFFFF'; ctx.stroke();
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}

function eventCard(x, y, w, h, { title, creator, badge, time = null, alpha = 1, rot = 0 } = {}) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.translate(-(x + w / 2), -(y + h / 2));
  fillRR(x, y, w, h, 16 * U, C.surface, { shadow: 0.5 });
  strokeRR(x, y, w, h, 16, 'rgba(228,200,213,.75)', 1.4);
  ctx.beginPath(); ctx.arc(x + 44 * U, y + h / 2, 22 * U, 0, Math.PI * 2);
  ctx.fillStyle = '#F2E7EC'; ctx.fill();
  text(creator.slice(0, 1), x + 44 * U, y + h / 2, { size: 20, weight: 700, color: C.faint, align: 'center' });
  if (time) text(time, x + 92 * U, y + h / 2, { size: 26, weight: 700, color: C.faint, family: FONT_NUM });
  const tx = x + (time ? 178 : 92) * U;
  text(creator, tx, y + h / 2 - 15 * U, { size: 20, weight: 700, color: C.muted });
  text(title, tx, y + h / 2 + 15 * U, { size: 18, weight: 500, color: C.faint, maxWidth: w - (tx - x) - 110 * U });
  if (badge) {
    const bw = measure(badge, 16, 700) + 24 * U;
    fillRR(x + w - bw - 18 * U, y + h / 2 - 15 * U, bw, 30 * U, 15, '#F1EBEE');
    text(badge, x + w - bw / 2 - 18 * U, y + h / 2, { size: 16, weight: 700, color: C.faint, align: 'center' });
  }
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}

function chip(s, x, y, { size = 21, alpha = 1, fill = C.soft, color = C.pinkStrong, h = 46 } = {}) {
  const w = measure(s, size, 700) + 40 * U;
  fillRR(x, y, w, h * U, (h / 2) * U, fill, { alpha });
  text(s, x + w / 2, y + (h / 2) * U, { size, weight: 700, color, align: 'center', alpha });
  return w;
}

// ─────────────────────────────────────────────────────────────── 背景
function background(t, { warm = 1, glow = 1 } = {}) {
  const g = ctx.createLinearGradient(0, 0, W * 0.35, H);
  g.addColorStop(0, mix('#FFF8FB', '#F4EFF2', 1 - warm));
  g.addColorStop(0.5, mix('#FFF3F8', '#F2EDF0', 1 - warm));
  g.addColorStop(1, mix('#FDEBF3', '#EDE7EA', 1 - warm));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blob = (bx, by, r, a) => {
    const rg = ctx.createRadialGradient(bx, by, 0, bx, by, r);
    rg.addColorStop(0, rgba('#E94F88', a * glow)); rg.addColorStop(1, 'rgba(233,79,136,0)');
    ctx.fillStyle = rg; ctx.fillRect(bx - r, by - r, r * 2, r * 2);
  };
  blob(W * 0.16, H * 0.10, 720 * U, 0.13);
  blob(W * 0.88, H * 0.92, 820 * U, 0.11);
}

const CUTS = [b(8), b(15), b(25), b(35), b(45), b(55), b(66)];
function cutFlash(t) {
  const v = pulse(t, CUTS, 0.10, 0.006);
  if (v > 0.002) {
    ctx.save();
    ctx.globalAlpha = clamp(v * 0.55);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────── 01 HOOK 0–4s
function drawHook(t) {
  const t0 = shot('hook').t0;
  background(t, { warm: 0.25, glow: 0.35 });

  const st = b(1);
  const clockA = clamp((t - st + 0.2) / 0.4);
  const blink = 0.55 + 0.45 * Math.abs(Math.cos((t - st) * 2.6));
  if (clockA > 0) {
    ctx.save(); ctx.globalAlpha = clockA;
    text('21:00', 150 * U, 190 * U, { size: 104, weight: 700, color: C.ink, family: FONT_NUM });
    text('开播', 158 * U, 262 * U, { size: 26, weight: 700, color: C.grey, spacing: 6 });
    ctx.globalAlpha = clockA * blink;
    ctx.beginPath(); ctx.arc(150 * U + measure('21:00', 104, 700, FONT_NUM) + 22 * U, 168 * U, 8 * U, 0, Math.PI * 2);
    ctx.fillStyle = '#D83A52'; ctx.fill();
    ctx.restore();
  }

  const falls = [b(2), b(3), b(4)];
  const rows = [
    { time: '21:00', creator: '乃琳Queen', title: '四季歌回 —— 秋日印象' },
    { time: '19:30', creator: '嘉然今天吃什么', title: '枝江时装周' },
    { time: '13:00', creator: '贝拉kira', title: '【突击】继续看小当家！' },
  ];
  rows.forEach((r, i) => {
    const k = spring(t - falls[i], { freq: 2.2, damp: 0.55 });
    if (k <= 0.001) return;
    const y0 = 360 * U - 120 * U * (1 - k) + i * 128 * U;
    const x0 = (1060 + i * 26) * U;
    const rot = (i - 1) * 0.014 + 0.02 * (1 - k);
    eventCard(x0, y0, 700 * U, 108 * U, { ...r, badge: '已结束', alpha: clamp(k * 1.4), rot });
  });

  const k1 = seg(t, b(5), b(6.4));
  if (k1 > 0) riseChars('又一次，错过了', 150 * U, 640 * U, { size: 96, weight: 700, color: C.ink, k: k1 });
  const k2 = seg(t, b(5.6), b(7));
  if (k2 > 0) text('刷完视频切回来，直播间已经黑了', 154 * U, 740 * U, { size: 30, weight: 500, color: C.muted, alpha: k2 });

  const k3 = seg(t, b(2), b(4));
  ctx.save();
  ctx.globalAlpha = 0.5 * k3;
  ctx.fillStyle = C.border;
  ctx.fillRect(150 * U, 880 * U, (W - 300 * U) * ease.outCubic(k3), 1.5 * U);
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}

// ─────────────────────────────────────────────────────────────── 02 REVEAL 4–7.5s
function drawReveal(t) {
  const t0 = shot('reveal').t0;
  background(t, { warm: 1, glow: 1 });

  [0, b(1), b(2)].forEach((d) => {
    const k = seg(t, t0 + d, t0 + d + 1.4);
    if (k <= 0 || k >= 1) return;
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.5;
    ctx.beginPath(); ctx.arc(cx, 430 * U, (120 + 720 * ease.outCubic(k)) * U, 0, Math.PI * 2);
    ctx.lineWidth = (3 - 2 * k) * U; ctx.strokeStyle = C.pink; ctx.stroke();
    ctx.restore();
  });

  const lg = spring(t - (t0 + 0.1), { freq: 1.9, damp: 0.62 });
  drawLogo(cx, 410 * U, 200 * U * (0.55 + 0.45 * lg), clamp(lg * 1.6), (1 - lg) * -0.2);

  const nameK = seg(t, t0 + b(2), t0 + b(3.4));
  if (nameK > 0) {
    const y = 590 * U;
    const wCN = measure('推历', 86, 700), wEN = measure('OshiCal', 86, 400);
    const gap = 24 * U, total = wCN + gap + wEN;
    const x = cx - total / 2;
    text('推历', x, y + (1 - ease.outQuart(nameK)) * 26 * U, { size: 86, weight: 700, color: C.ink, alpha: nameK });
    text('OshiCal', x + wCN + gap, y + (1 - ease.outQuart(clamp((nameK - 0.2) / 0.8))) * 26 * U,
         { size: 86, weight: 400, color: C.pinkStrong, alpha: nameK });
  }

  const tagK = seg(t, t0 + b(3.6), t0 + b(5));
  if (tagK > 0) text('B 站虚拟主播的直播日程与开播提醒', cx, 682 * U, { size: 40, weight: 500, color: C.muted, align: 'center', alpha: tagK });

  const chips = ['日程抓取', '时间线 / 日历', '主播库', '开播提醒', '多端同步'];
  const ws = chips.map(s => measure(s, 21, 700) + 40 * U);
  const totalW = ws.reduce((a, v) => a + v, 0) + 16 * U * (chips.length - 1);
  let px = cx - totalW / 2;
  const chipK0 = t0 + b(5.2);
  chips.forEach((s, i) => {
    const k = spring(t - (chipK0 + i * 0.08), { freq: 3.0, damp: 0.78 });
    if (k > 0.001) {
      fillRR(px, 760 * U, ws[i], 46 * U, 23, C.surface, { shadow: 0.25, alpha: clamp(k) });
      strokeRR(px, 760 * U, ws[i], 46 * U, 23, 'rgba(228,200,213,.9)', 1.2, clamp(k));
      text(s, px + ws[i] / 2, 783 * U, { size: 21, weight: 700, color: C.pinkStrong, align: 'center', alpha: clamp(k) });
    }
    px += ws[i] + 16 * U;
  });
}

// ─────────────────────────────────────────────────────────────── 03 PARSE 7.5–12.5s
function drawParse(t) {
  const t0 = shot('parse').t0;
  background(t, { warm: 1, glow: 0.8 });

  const headK = seg(t, t0 + b(0.2), t0 + b(1.2));
  if (headK > 0) {
    text('动态里的日程图，直接变成日程', 90 * U, 108 * U, { size: 52, weight: 700, color: C.ink, alpha: headK });
    text('图片 / 直播预约卡 / 纯文本，走同一条解析链路', 92 * U, 160 * U, { size: 24, weight: 500, color: C.muted, alpha: headK });
  }

  // 左：B 站图文动态（示意插画，不是产品界面）
  const dynK = spring(t - (t0 + b(1.6)), { freq: 2.4, damp: 0.8 });
  if (dynK > 0.002) {
    const dx = 90 * U, dy = 208 * U, dw = 500 * U, dh = 424 * U;
    ctx.save();
    ctx.globalAlpha = clamp(dynK);
    ctx.translate(0, (1 - dynK) * 30 * U);
    fillRR(dx, dy, dw, dh, 22, C.surface, { shadow: 0.55 });
    strokeRR(dx, dy, dw, dh, 22, 'rgba(228,200,213,.85)', 1.4);
    ctx.beginPath(); ctx.arc(dx + 50 * U, dy + 50 * U, 23 * U, 0, Math.PI * 2); ctx.fillStyle = '#FBE3EC'; ctx.fill();
    text('嘉', dx + 50 * U, dy + 50 * U, { size: 21, weight: 700, color: C.pinkStrong, align: 'center' });
    text('嘉然今天吃什么', dx + 84 * U, dy + 40 * U, { size: 21, weight: 700, color: C.ink });
    text('发布了图文动态 · 11/06 直播日程', dx + 84 * U, dy + 68 * U, { size: 16, weight: 500, color: C.faint });
    fillRR(dx + 22 * U, dy + 96 * U, dw - 44 * U, 268 * U, 16, '#FFF6FA', { shadow: 0.15 });
    strokeRR(dx + 22 * U, dy + 96 * U, dw - 44 * U, 268 * U, 16, 'rgba(233,79,136,.22)', 1.4);
    text('11/06 周五 · 直播安排', dx + 48 * U, dy + 132 * U, { size: 21, weight: 700, color: C.pinkStrong });
    const rows = [['06:00', '小鼠做法BLG给我冲！'], ['12:00', '【突击】继续影之刃之旅'], ['21:00', 'A-SOUL团综——AAA枝江']];
    const scanK = seg(t, t0 + b(2.6), t0 + b(4.4));
    rows.forEach((r, i) => {
      const ry = dy + 172 * U + i * 58 * U;
      text(r[0], dx + 48 * U, ry, { size: 21, weight: 700, color: C.ink, family: FONT_NUM });
      text(r[1], dx + 132 * U, ry, { size: 18, weight: 500, color: C.muted, maxWidth: dw - 190 * U });
      ctx.save(); ctx.globalAlpha *= 0.5; ctx.fillStyle = C.border;
      ctx.fillRect(dx + 48 * U, ry + 24 * U, dw - 120 * U, 1); ctx.restore();
    });
    if (scanK > 0 && scanK < 1) {
      const sy = dy + 96 * U + 268 * U * ease.inOutCubic(scanK);
      ctx.save(); rr(dx + 22 * U, dy + 96 * U, dw - 44 * U, 268 * U, 16); ctx.clip();
      const g = ctx.createLinearGradient(dx, sy - 40 * U, dx, sy + 8 * U);
      g.addColorStop(0, 'rgba(233,79,136,0)'); g.addColorStop(1, 'rgba(233,79,136,.35)');
      ctx.fillStyle = g; ctx.fillRect(dx + 22 * U, sy - 40 * U, dw - 44 * U, 48 * U);
      ctx.fillStyle = C.pink; ctx.globalAlpha = 0.9; ctx.fillRect(dx + 22 * U, sy, dw - 44 * U, 2 * U);
      ctx.restore();
    }
    fillRR(dx + 22 * U, dy + dh - 52 * U, 140 * U, 34 * U, 17, C.pinkSoft);
    text('日程图', dx + 92 * U, dy + dh - 35 * U, { size: 16, weight: 700, color: C.pinkStrong, align: 'center' });
    ctx.restore();
  }

  // 中：视觉模型节点
  const nodeK = spring(t - (t0 + b(2.4)), { freq: 2.2, damp: 0.75 });
  const nx = 690 * U, ny = 430 * U;
  if (nodeK > 0.002) {
    ctx.save();
    ctx.globalAlpha = clamp(nodeK);
    ctx.save();
    ctx.translate(nx, ny); ctx.rotate(t * 0.8);
    ctx.beginPath(); ctx.arc(0, 0, 74 * U, 0, Math.PI * 2);
    ctx.setLineDash([10 * U, 12 * U]); ctx.lineWidth = 2 * U; ctx.strokeStyle = 'rgba(233,79,136,.45)'; ctx.stroke();
    ctx.restore();
    fillRR(nx - 58 * U, ny - 58 * U, 116 * U, 116 * U, 32, C.surface, { shadow: 0.5 });
    drawLogo(nx, ny - 10 * U, 52 * U, 1);
    text('视觉模型', nx, ny + 38 * U, { size: 16, weight: 700, color: C.pinkStrong, align: 'center' });
    const blink = 0.4 + 0.6 * Math.abs(Math.cos(t * 3.4));
    ctx.globalAlpha = clamp(nodeK) * blink;
    ctx.beginPath(); ctx.arc(nx + 62 * U, ny - 62 * U, 7 * U, 0, Math.PI * 2); ctx.fillStyle = C.live; ctx.fill();
    ctx.restore();
  }

  const linkK = seg(t, t0 + b(2.8), t0 + b(3.8));
  if (linkK > 0) {
    ctx.save();
    ctx.globalAlpha = 0.55 * linkK;
    ctx.beginPath(); ctx.moveTo(596 * U, 430 * U);
    ctx.bezierCurveTo(630 * U, 430 * U, 630 * U, 430 * U, nx - 76 * U, 430 * U);
    ctx.setLineDash([8 * U, 10 * U]); ctx.lineWidth = 2 * U; ctx.strokeStyle = C.pink; ctx.stroke();
    ctx.restore();
  }

  // 右：真实时间线窗口
  const winK = spring(t - (t0 + b(0.8)), { freq: 2.0, damp: 0.85 });
  const wx = 800 * U, wy = 230 * U, ww = 1080 * U;
  const wh = ww * IMG.timeline.height / IMG.timeline.width;
  let map = null;
  if (winK > 0.002) {
    ctx.save();
    ctx.globalAlpha = clamp(winK);
    ctx.translate(0, (1 - winK) * 40 * U);
    map = shotWindow(IMG.timeline, wx, wy, ww, wh, { r: 18, shadow: 0.6 });
    ctx.restore();
  }

  const targets = [
    { r: [404, 198, 797, 282], t: b(20.5) },
    { r: [827, 198, 1219, 282], t: b(22) },
    { r: [827, 296, 1219, 383], t: b(23.5) },
  ];
  if (map) {
    targets.forEach(tg => {
      const [ax, ay, k] = map(tg.r[0], tg.r[1]);
      const [bx2, by2] = map(tg.r[2], tg.r[3]);
      const p = seg(t, tg.t, tg.t + b(1.4));
      if (p <= 0) return;
      // 飞行的小卡
      if (p < 1) {
        const e = ease.inOutCubic(p);
        const fxs = lerp(nx, ax + (bx2 - ax) / 2, e) + Math.sin(e * Math.PI) * 26 * U;
        const fys = lerp(ny, ay + (by2 - ay) / 2, e) - Math.sin(e * Math.PI) * 100 * U;
        const sc = lerp(0.66, 0.3, e);
        ctx.save();
        ctx.globalAlpha = clamp(1.25 - e * 1.15);
        ctx.translate(fxs, fys); ctx.scale(sc, sc);
        fillRR(-150 * U, -28 * U, 300 * U, 56 * U, 14, C.surface, { shadow: 0.7 });
        text('已解析 → 日程', -150 * U + 18 * U, 0, { size: 20, weight: 700, color: C.pinkStrong });
        ctx.restore();
      }
      ringRect(ax, ay, bx2 - ax, by2 - ay, p, tg.t, t);
    });
  }

  const footK = seg(t, t0 + b(6), t0 + b(7.4));
  if (footK > 0) {
    text('一条动态只调用一次模型 · 输出经长度、时间、主播归属与置信度校验后才入库',
         90 * U, 1004 * U, { size: 20, weight: 500, color: C.faint, alpha: footK });
  }
}

// ─────────────────────────────────────────────────────────────── 06 ALERT 22.5–27.5s
function drawAlert(t) {
  const t0 = shot('alert').t0;
  background(t, { warm: 1, glow: 0.7 });

  const bgK = seg(t, t0, t0 + 0.5);
  ctx.save();
  ctx.globalAlpha = 0.34 * bgK;
  const bw = 1520 * U;

  ctx.restore();
  ctx.save(); ctx.globalAlpha = 0.46 * bgK; ctx.fillStyle = C.paper; ctx.fillRect(0, 0, W, H); ctx.restore();

  const click = b(50);
  const pressed = pulse(t, click, 0.16);
  const openK = seg(t, b(50.4), b(52.0));
  const toastIn = spring(t - b(46.5), { freq: 2.6, damp: 0.72 });

  const twW = 600 * U, twH = 152 * U;
  const restX = W - twW - 90 * U, restY = H - twH - 210 * U;

  if (openK > 0) {
    const pw = 1000 * U, ph = 562 * U;
    const px = cx - pw / 2, py = 244 * U;
    const e = ease.outQuart(openK);
    const rx = lerp(restX, px, e), ry = lerp(restY, py, e);
    const rw = lerp(twW, pw, e), rh = lerp(twH, ph, e);
    ctx.save();
    ctx.globalAlpha = clamp(openK * 4);
    fillRR(rx, ry, rw, rh, lerp(20, 26, e) * U, '#1A1216', { shadow: 0.9 });
    ctx.save();
    rr(rx, ry, rw, rh, lerp(20, 26, e) * U); ctx.clip();
    const g = ctx.createLinearGradient(rx, ry, rx + rw, ry + rh);
    g.addColorStop(0, '#2A1620'); g.addColorStop(0.5, '#3A1C2C'); g.addColorStop(1, '#22121A');
    ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
    const blob = (bx, by, r, col) => { const rg = ctx.createRadialGradient(bx, by, 0, bx, by, r); rg.addColorStop(0, col); rg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = rg; ctx.fillRect(bx - r, by - r, r * 2, r * 2); };
    blob(rx + rw * 0.32, ry + rh * 0.42, 380 * U, 'rgba(233,79,136,.32)');
    blob(rx + rw * 0.72, ry + rh * 0.6, 300 * U, 'rgba(120,90,255,.22)');

    if (e > 0.25) {
      const cA = clamp((e - 0.25) / 0.5);
      ctx.globalAlpha *= cA;
      text('直播间', rx + 40 * U, ry + 52 * U, { size: 24, weight: 700, color: 'rgba(255,255,255,.92)' });
      text('乃琳Queen', rx + 132 * U, ry + 52 * U, { size: 24, weight: 500, color: 'rgba(255,255,255,.55)' });
      const lp = 0.6 + 0.4 * Math.abs(Math.cos(t * 3));
      fillRR(rx + rw - 132 * U, ry + 34 * U, 92 * U, 36 * U, 18, rgba('#16A46B', 0.9 * lp));
      text('LIVE', rx + rw - 86 * U, ry + 52 * U, { size: 17, weight: 700, color: '#FFFFFF', align: 'center', spacing: 2 });
      const danmu = ['来了来了', '终于开播了', '今天的歌单好期待', '推历提醒是真的快', '前排', '这个点还能赶上', 'BGM 好听'];
      danmu.forEach((d, i) => {
        const life = ((t * 0.42 + i * 0.17) % 1);
        const dxp = rx + rw + 40 * U - life * (rw + 560 * U);
        const dyp = ry + rh * 0.30 + (i % 4) * 46 * U + Math.sin((t * 0.7 + i) * 1.3) * 5 * U;
        const a = Math.sin(Math.PI * clamp(life * 1.15)) * 0.9;
        ctx.save(); ctx.globalAlpha *= clamp(a);
        const tw2 = measure(d, 20, 600) + 32 * U;
        fillRR(dxp, dyp - 18 * U, tw2, 36 * U, 18, 'rgba(255,255,255,.13)');
        text(d, dxp + 16 * U, dyp, { size: 20, weight: 600, color: 'rgba(255,255,255,.92)' });
        ctx.restore();
      });
    }
    ctx.restore();
    ctx.restore();
  }

  const toastA = clamp(toastIn) * (1 - clamp(openK * 10));
  if (toastA > 0.002) {
    const tx = lerp(W + 40 * U, restX, clamp(toastIn)) - pressed * 3 * U;
    const ty = restY + (1 - clamp(toastIn)) * 20 * U;
    const sc = 1 - pressed * 0.03;
    ctx.save();
    ctx.translate(tx + twW / 2, ty + twH / 2); ctx.scale(sc, sc); ctx.translate(-(tx + twW / 2), -(ty + twH / 2));
    fillRR(tx, ty, twW, twH, 20, '#FFFFFF', { shadow: 0.75, alpha: toastA });
    strokeRR(tx, ty, twW, twH, 20, 'rgba(228,200,213,.8)', 1.3, toastA);
    drawLogo(tx + 72 * U, ty + twH / 2, 76 * U, toastA);
    text('乃琳Queen 开播了', tx + 132 * U, ty + 56 * U, { size: 30, weight: 700, color: C.ink, alpha: toastA });
    text('点击进入直播间', tx + 132 * U, ty + 100 * U, { size: 22, weight: 500, color: C.muted, alpha: toastA });
    text('刚刚', tx + twW - 34 * U, ty + 40 * U, { size: 18, weight: 500, color: C.faint, align: 'right', alpha: toastA });
    ctx.restore();
  }

  const moveK = seg(t, b(47.4), click);
  if (moveK > 0 && openK < 0.4) {
    const cxp = lerp(restX + 400 * U, restX + 330 * U, ease.inOutCubic(moveK));
    const cyp = lerp(H - 40 * U, restY + 172 * U, ease.inOutCubic(moveK));
    cursor(cxp, cyp, { press: pressed });
  }

  const copyK = seg(t, b(47), b(48.2));
  if (copyK > 0) {
    text('开播，桌面先告诉你', 120 * U, 900 * U, { size: 56, weight: 700, color: C.ink, alpha: copyK });
    text('Windows 通知 · 托盘常驻 · 点击直达直播间 · 可选开机自启', 122 * U, 962 * U,
         { size: 24, weight: 500, color: C.muted, alpha: copyK });
  }
}

// ─────────────────────────────────────────────────────────────── 主循环
window.DUR = DUR;
function drawFrame(t) {
  t = clamp(t, 0, DUR);
  ctx.save();
  const [sx, sy] = shake(t, [b(8), b(66)], 10 * U, 0.22, 3);
  ctx.translate(sx, sy);
  const push = 1 + 0.030 * (t / DUR);
  ctx.translate(cx, cy); ctx.scale(push, push); ctx.translate(-cx, -cy);

  if (t < shot('reveal').t0) drawHook(t);
  else if (t < shot('parse').t0) drawReveal(t);
  else if (t < shot('views').t0) drawParse(t);
  else if (t < shot('library').t0) drawViews(t);
  else if (t < shot('alert').t0) drawLibrary(t);
  else if (t < shot('data').t0) drawAlert(t);
  else if (t < shot('end').t0) drawData(t);
  else drawEnd(t);

  cutFlash(t);
  ctx.restore();
  // 不再每帧 getImageData：首帧空白已由 READY 前的等待 + 首帧 Promise 解决（省 ~14ms/帧）
}

// window.render 在资源加载完成后再挂上：加载失败时渲染工具会等，而不是拿到半成品页面
let warmedUp = false;

// ─────────────────────────────────────────────────────────────── 资源
const IMG = {};
async function mustLoad(src, tries = 6) {
  let last;
  for (let i = 0; i < tries; i++) {
    try { return await loadImage(src); }
    catch (e) { last = e; await new Promise(r => setTimeout(r, 320)); }
  }
  throw new Error('asset failed to load: ' + src + ' (' + (last && last.message) + ')');
}
const LOGO = await mustLoad('assets/app-icon.png');
for (const [k, p] of [['timeline', 'assets/ui-timeline.png'], ['grid', 'assets/ui-grid.png'],
                      ['library', 'assets/ui-library.png'], ['settings', 'assets/ui-settings.png'],
                      ['sync', 'assets/ui-sync.png']]) {
  IMG[k] = await mustLoad(p);
}
await loadFonts(['700 96px "Microsoft YaHei"', '500 32px "Microsoft YaHei"', '400 72px "Microsoft YaHei"',
                 '700 96px "Microsoft YaHei UI"', '700 104px "Consolas"', '700 66px "Consolas"']);
window.render = t => {
  drawFrame(t);
  if (warmedUp || !window.READY) return undefined;
  warmedUp = true;
  return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 150))));
};
window.render(0);
ctx.getImageData(0, 0, 1, 1);
await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => requestAnimationFrame(r))));
await new Promise(r => setTimeout(r, 250));
window.READY = true;
</script>
</body>
