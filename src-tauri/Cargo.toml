[package]
name = "oshical-desktop"
version = "0.3.6"
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "oshical_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oshical"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oshical-core = { path = "../crates/core" }
chrono.workspace = true
futures-util = "0.3"
reqwest.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# `tray-icon` 的 crate 依赖在 tauri 里只对桌面 target 生效，因此这里保持全局开启；
# 业务代码必须用 `#[cfg(desktop)]` 隔离 `tauri::tray`。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
tokio-tungstenite = "0.29"
tracing.workspace = true
url.workspace = true

# 桌面专属：Windows 凭据管理器、开机自启、应用内更新和进程重启都不支持 Android/iOS。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-autostart = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
